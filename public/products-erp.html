<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products (ERP) — Summit Flooring CRM</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20260819-menu-fix-v2" />
  <link rel="stylesheet" href="design-system.css?v=20260819-menu-fix-v2" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=20260827-shell" />
  <link rel="stylesheet" href="crm-responsive.css?v=20260827-shell" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260827-shell" />
  <link rel="stylesheet" href="crm-page.css?v=20260827-shell" />
  <script src="crm-tailwind-brand.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = window.SUMMIT_TAILWIND_CONFIG;
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crm-toast.css" />
  <style>body { font-family: Inter, system-ui, sans-serif; }</style>
</head>
<body class="dashboard-app-body bg-slate-50 text-slate-900 min-h-screen">
  <header class="mobile-app-header" id="mobileAppHeader" aria-label="Barra superior">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="productsSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/logoSummitFlooring.png" alt="" class="mobile-app-header__logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Produtos</h1>
    </div>
  </header>
  <div class="dashboard-container">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="dashboard-sidebar" id="productsSidebar" aria-label="Menu lateral">
      <div class="sidebar-header">
        <img src="/assets/logoSummitFlooring.png" alt="Summit Flooring" class="sidebar-brand-logo logo-image" width="104" height="104" onerror="this.style.display='none'" />
      </div>
      <nav class="sidebar-nav" aria-label="Navegação CRM">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Terminar sessão">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="dashboard-main">
      <div class="crm-page">
        <div class="max-w-6xl mx-auto px-4 py-8 space-y-8">
          <h1 class="text-xl font-bold text-slate-900 border-b border-slate-200 pb-3">Products &amp; margins</h1>
          <p id="authMsg" class="text-red-600 text-sm hidden"></p>

          <section class="bg-white rounded-xl border shadow-sm p-6 space-y-3">
            <h2 class="text-sm font-bold text-slate-800">Default margin by category</h2>
            <p class="text-xs text-slate-500">Used when adding a product to a quote (can override per line).</p>
            <div id="marginsList" class="grid sm:grid-cols-2 gap-3 text-sm"></div>
          </section>

          <section class="bg-white rounded-xl border shadow-sm p-6 space-y-4">
            <div class="flex flex-wrap gap-3 items-end">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Supplier</label>
                <select id="filterSupplier" class="border rounded-lg px-3 py-2 text-sm min-w-[200px]"></select>
              </div>
              <div class="flex-1 min-w-[160px]">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Search</label>
                <input type="search" id="filterQ" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Name / SKU" />
              </div>
              <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" id="showInactive" class="rounded" /> Inactive</label>
              <button type="button" id="btnReload" class="btn btn-sm btn-secondary">Refresh</button>
              <button type="button" id="btnNew" class="btn btn-sm btn-primary">+ Product</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-left text-xs text-slate-500 uppercase">
                  <tr>
                    <th class="px-3 py-2">Supplier</th>
                    <th class="px-3 py-2">Name</th>
                    <th class="px-3 py-2">Category</th>
                    <th class="px-3 py-2">Unit</th>
                    <th class="px-3 py-2 text-right">Cost</th>
                    <th class="px-3 py-2">SKU</th>
                    <th class="px-3 py-2">Active</th>
                    <th class="px-3 py-2 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-3 max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitle" class="text-lg font-bold">Product</h2>
      <input type="hidden" id="editId" />
      <div>
        <label class="text-xs font-semibold text-slate-500">Supplier *</label>
        <select id="fSupplier" class="w-full border rounded-lg px-3 py-2 text-sm"></select>
      </div>
      <div><label class="text-xs font-semibold text-slate-500">Name *</label><input id="fName" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Category *</label>
        <select id="fCategory" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="Hardwood">Hardwood</option>
          <option value="LVP">LVP</option>
          <option value="Engineered">Engineered</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500">Unit *</label>
        <select id="fUnit" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="sq_ft">Sq Ft</option>
          <option value="box">Box</option>
          <option value="piece">Piece</option>
        </select>
      </div>
      <div><label class="text-xs font-semibold text-slate-500">Cost price *</label><input id="fCost" type="number" step="0.0001" min="0" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="text-xs font-semibold text-slate-500">SKU</label><input id="fSku" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
      <div><label class="text-xs font-semibold text-slate-500">Description</label><textarea id="fDesc" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
      <div><label class="text-xs font-semibold text-slate-500">Stock (optional)</label><input id="fStock" type="number" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Leave empty" /></div>
      <div id="activeWrap" class="hidden"><label class="inline-flex gap-2 text-sm"><input type="checkbox" id="fActive" checked /> Active</label></div>
      <p id="formError" class="text-red-600 text-sm hidden"></p>
      <div class="flex justify-end gap-2">
        <button type="button" id="btnCancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="btnSave" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
  <script src="crm-viewport.js?v=20260827-shell"></script>
  <script src="crm-mobile-chrome.js?v=20260827-shell"></script>
  <script src="crm-shared-nav.js?v=20260827-shell"></script>
  <script src="crm-toast.js"></script>
  <script src="products-erp.js?v=1"></script>
</body>
</html>

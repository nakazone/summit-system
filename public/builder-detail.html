<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">

<link rel="stylesheet" href="styles.css?v=20260827-page-panel" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    .bd-layout { display: grid; grid-template-columns: 280px 1fr; gap: 1.25rem; align-items: start; }
    .bd-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--bp-navy); color: var(--bp-tan); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
    .bd-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; border-bottom: 1px solid var(--bp-border); padding-bottom: 8px; }
    .bd-tabs button { background: none; border: none; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--bp-muted); border-radius: 8px; }
    .bd-tabs button.active { background: var(--bp-tan-pale); color: var(--bp-navy); }
    .bd-panel { display: none; }
    .bd-panel.active { display: block; }
    @media (max-width: 900px) { .bd-layout { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="crm-responsive.css?v=20260827-shell" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260827-shell" />
  <link rel="stylesheet" href="crm-page.css?v=20260827-page-panel" />
</head>
<body class="dashboard-app-body bp-page-body payroll-sidebar-page">

  <header class="mobile-app-header" id="mobileAppHeader" aria-label="Barra superior">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="bpSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/logoSummitFlooring.png" alt="" class="mobile-app-header__logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Builder</h1>
    </div>
  </header>

  <div class="dashboard-container">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="dashboard-sidebar" id="bpSidebar" aria-label="Menu lateral">
      <div class="sidebar-header"><img src="/assets/logoSummitFlooring.png" alt="Summit Flooring" class="sidebar-brand-logo logo-image" width="104" height="104" onerror="this.style.display='none'" /></div>
      <nav class="sidebar-nav" aria-label="Navegação CRM"><div id="crmSharedNavRoot" data-layout="sidebar"></div></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Terminar sessão">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="dashboard-main">
      <div class="bp-main">
        <p class="bp-eyebrow"><a href="builders.html">Builders</a> / Perfil</p>
        <div class="bd-layout" id="detailRoot">
          <p>A carregar…</p>
        </div>
      </div>
    </main>
  </div>
  <script src="crm-viewport.js?v=20260827-shell"></script>
  <script src="crm-mobile-chrome.js?v=20260827-shell"></script>
  <script src="crm-shared-nav.js?v=20260827-shell"></script>
  <script src="crm-toast.js"></script>
  <script src="builder-detail.js?v=20260819-del-builder"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de serviços — Orçamentos</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=20260819-menu-fix-v2" />
  <link rel="stylesheet" href="design-system.css?v=20260819-menu-fix-v2" />
  <link rel="stylesheet" href="crm-shared-nav.css?v=20260827-shell" />
  <link rel="stylesheet" href="crm-responsive.css?v=20260827-shell" />
  <link rel="stylesheet" href="mobile-design-system.css?v=20260827-shell" />
  <link rel="stylesheet" href="crm-page.css?v=20260827-shell" />
  <script src="crm-tailwind-brand.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = window.SUMMIT_TAILWIND_CONFIG;
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="crm-toast.css" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .catalog-tab.catalog-tab--active {
      background: var(--sf-gold-bg, #faf7f2);
      border-color: var(--color-accent, #d6c4a8);
      color: var(--color-primary, #1c1c1f);
      font-weight: var(--font-semibold, 600);
    }
  </style>
</head>
<body class="dashboard-app-body bg-slate-50 text-slate-900 min-h-screen">
  <header class="mobile-app-header" id="mobileAppHeader" aria-label="Barra superior">
    <button type="button" class="mobile-app-header__menu" id="mobileMenuToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="catalogSidebar">
      <span class="mobile-app-header__menu-icon" aria-hidden="true"></span>
    </button>
    <div class="mobile-app-header__brand">
      <img src="/assets/logoSummitFlooring.png" alt="" class="mobile-app-header__logo" width="28" height="28" onerror="this.style.display='none'" />
      <h1 class="mobile-app-header__title">Serviços</h1>
    </div>
  </header>
  <div class="dashboard-container">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <aside class="dashboard-sidebar" id="catalogSidebar" aria-label="Menu lateral">
      <div class="sidebar-header">
        <img src="/assets/logoSummitFlooring.png" alt="Summit Flooring" class="sidebar-brand-logo logo-image" width="104" height="104" onerror="this.style.display='none'" />
      </div>
      <nav class="sidebar-nav" aria-label="Navegação CRM">
        <div id="crmSharedNavRoot" data-layout="sidebar"></div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-bar">
          <div class="sidebar-user-bar__avatar" id="sidebarUserAvatar" aria-hidden="true">—</div>
          <div class="sidebar-user-bar__text">
            <span class="sidebar-user-bar__name" id="sidebarUserName">—</span>
            <span class="sidebar-user-bar__role" id="sidebarUserRole"></span>
          </div>
          <button type="button" id="logoutBtn" class="sidebar-logout-btn" title="Sair" aria-label="Terminar sessão">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="dashboard-main">
      <div class="crm-page">
        <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
          <div class="border-b border-slate-200 pb-4">
            <h1 class="text-xl font-bold text-slate-900">Catálogo de serviços</h1>
            <p class="text-sm text-slate-500 mt-1">Linhas pré-definidas para Quote</p>
          </div>
          <p id="authMsg" class="text-red-600 text-sm hidden"></p>
          <p id="migrateMsg" class="text-amber-700 text-sm hidden"></p>

          <div class="flex flex-wrap items-center justify-between gap-3">
            <label class="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
              <input type="checkbox" id="showInactive" class="rounded border-slate-300" />
              Mostrar inativos
            </label>
            <button type="button" id="btnNew" class="btn btn-primary">
              + Novo serviço
            </button>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 border-b text-left text-xs font-semibold text-slate-500 uppercase tracking-wide">
                  <tr>
                    <th class="px-4 py-3">Nome</th>
                    <th class="px-4 py-3">Categoria</th>
                    <th class="px-4 py-3">Unidade</th>
                    <th class="px-4 py-3 text-right">Builder</th>
                    <th class="px-4 py-3 text-right">Cliente final</th>
                    <th class="px-4 py-3">Ativo</th>
                    <th class="px-4 py-3 text-right">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <p id="empty" class="hidden p-8 text-center text-slate-500 text-sm">Nenhum item. Rode a migração do módulo Quotes ou crie um serviço.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/50" aria-modal="true">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 space-y-4">
      <h2 id="modalTitle" class="text-lg font-bold text-slate-900">Novo serviço</h2>
      <form id="form" class="space-y-3">
        <input type="hidden" id="editId" value="" />
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Nome do serviço *</label>
          <input id="fName" type="text" required maxlength="255" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex.: Instalação de LVP — mão de obra" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Categoria *</label>
          <select id="fCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <option value="Installation">Installation</option>
            <option value="Sand & Finishing">Sand &amp; Finishing</option>
            <option value="Supply">Supply</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Unidade *</label>
          <select id="fUnit" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <option value="sq_ft">Sq Ft (pé quadrado)</option>
            <option value="linear_ft">Linear Ft (pé linear)</option>
            <option value="inches">Inches</option>
            <option value="fixed">Fixed (preço fixo)</option>
          </select>
        </div>
        <div class="border-b border-slate-200 flex gap-1" role="tablist">
          <button type="button" data-catalog-tab="builder" class="catalog-tab btn btn-sm btn-secondary catalog-tab--active">Builder</button>
          <button type="button" data-catalog-tab="customer" class="catalog-tab btn btn-sm btn-secondary">Cliente final</button>
        </div>
        <div id="panelBuilder" class="catalog-panel space-y-3 border border-slate-200 rounded-b-lg rounded-tr-lg p-4 bg-slate-50/50">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Preço negociação Builder (USD) *</label>
            <input id="fRateBuilder" type="number" step="0.01" min="0" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" placeholder="0.00" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Notas Builder (interno)</label>
            <textarea id="fNotesBuilder" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" placeholder="Referência interna; não vai no PDF do cliente"></textarea>
          </div>
        </div>
        <div id="panelCustomer" class="catalog-panel hidden space-y-3 border border-slate-200 rounded-b-lg rounded-tr-lg p-4 bg-slate-50/50">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Preço negociação cliente final (USD) *</label>
            <input id="fRateCustomer" type="number" step="0.01" min="0" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" placeholder="0.00" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">Comentário cliente final (PDF)</label>
            <textarea id="fNotesCustomer" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white" placeholder="Aparece no orçamento final (PDF) por baixo da linha"></textarea>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Descrição padrão (texto da linha no orçamento)</label>
          <textarea id="fDesc" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Texto sugerido ao adicionar do catálogo"></textarea>
        </div>
        <div id="fActiveWrap" class="hidden">
          <label class="inline-flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" id="fActive" checked class="rounded border-slate-300" />
            Ativo (aparece no Quote)
          </label>
        </div>
        <p id="formError" class="text-red-600 text-sm hidden"></p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="btnSubmit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="crm-viewport.js?v=20260827-shell"></script>
  <script src="crm-mobile-chrome.js?v=20260827-shell"></script>
  <script src="crm-shared-nav.js?v=20260827-shell"></script>
  <script src="crm-toast.js"></script>
  <script src="quote-catalog.js?v=3"></script>
</body>
</html>
